# Grouped dependency updates. The group names matter: dependabot-auto-merge.yml merges only the
# npm-minor-patch and github-actions groups (after CI passes); npm-major waits for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
